plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = 'com.mcbot.servercontrol'
base { archivesName = 'mcbot-server-control' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
dependencies { testImplementation 'com.google.code.gson:gson:2.10.1' }
neoForge {
    version = project.neo_version
    parchment { mappingsVersion = '2024.11.17'; minecraftVersion = '1.21.1' }
    mods { mcbot_server_control { sourceSet(sourceSets.main) } }
    // Dev client for single-player (LAN) tests; game files stay in run/client, never the user's launcher instance.
    runs {
        client {
            client()
            gameDirectory = file('run/client')
            if (project.hasProperty('quickPlay')) programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            if (project.hasProperty('commandFixture')) systemProperty 'mcbot.commandFixture', project.property('commandFixture').toString()
        }
    }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.property 'mod_version', mod_version
    expand mod_version: mod_version
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
// Typed NBT regressions use the version-pinned game value classes without launching Minecraft.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('controlTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mcbot.servercontrol.ControlSessionTest'
    jvmArgs '-ea'
}
// Only these loader files may use NeoForge classes; everything else stays vanilla-only so a Fabric build can share it
// (docs/workstation_design.md, "加载器和版本").
def loaderFiles = ['McbotServerControl.java', 'NeoForgePlatform.java', 'ServerController.java', 'SurvivalActions.java',
                   'ValidationProtection.java', 'RespawnValidationFixture.java', 'IronFurnaceAdapter.java']
tasks.register('loaderNeutralCheck') {
    def sources = fileTree('src/main/java') { include '**/*.java' }
    inputs.files sources
    doLast {
        def bad = sources.files.findAll { !loaderFiles.contains(it.name) && it.getText('UTF-8').contains('net.neoforged') }.collect { it.name }.sort()
        if (bad) throw new GradleException("NeoForge classes outside the loader files: ${bad}")
    }
}
tasks.named('check') { dependsOn 'controlTest', 'loaderNeutralCheck' }
tasks.named('test') { enabled = false }
